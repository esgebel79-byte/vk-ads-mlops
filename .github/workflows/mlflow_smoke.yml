name: MLflow Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start MLflow service
        run: |
          docker compose up -d mlflow

      - name: Wait for MLflow
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "MLflow is ready"
              exit 0
            fi
            echo "Waiting for MLflow..."
            sleep 2
          done
          echo "MLflow did not become ready in time"
          docker compose logs mlflow
          exit 1

      - name: Run MLflow smoke script
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

          python - <<'PY'
          import mlflow

          mlflow.set_tracking_uri("http://127.0.0.1:5000")

          experiment = mlflow.get_experiment_by_name("ci-smoke")
          if experiment is None:
              experiment_id = mlflow.create_experiment("ci-smoke")
          else:
              experiment_id = experiment.experiment_id

          with mlflow.start_run(experiment_id=experiment_id):
              mlflow.log_param("smoke", True)
              mlflow.log_metric("accuracy", 0.5)

          print("MLflow smoke test passed")
          PY

      - name: Tear down
        if: always()
        run: |
          docker compose down

name: CD - Build and publish Docker images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/inference_api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vk-ads-mlops-api:latest
          build-args: |
            INSTALL_INFERENCE_DEPS=true

      - name: Build and push UI image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vk-ads-mlops-ui:latest

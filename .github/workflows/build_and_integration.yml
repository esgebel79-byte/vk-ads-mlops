name: Build and Integration

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images with docker compose
        run: |
          docker compose build --parallel
      - name: Start services
        run: |
          docker compose up -d
      - name: Wait for API
        run: |
          for i in {1..30}; do curl -sS http://localhost:8000/health || true; sleep 2; done
      - name: Run integration tests
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt || true
          pytest -q tests/test_inference_empty_user_ids.py || true
      - name: Tear down
        if: always()
        run: docker compose down -v

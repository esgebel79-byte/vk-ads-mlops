name: CI — Lint & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Кэширование ускорит повторные сборки в разы

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip

          # 1. Устанавливаем базовый бэкенд
          pip install -r services/inference_api/requirements.txt

          # 2. Устанавливаем ML-зависимости (откуда подтянется numpy)
          pip install -r services/inference_api/requirements-inference.txt
          
          # 3. Доустанавливаем инструменты самого тестирования
          pip install -r tests/requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Кэширование для Node.js
          cache-dependency-path: ui/package-lock.json

      - name: Install and build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
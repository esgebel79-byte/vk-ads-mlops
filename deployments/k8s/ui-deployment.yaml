apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-ads-ui
  namespace: vk-ads-mlops
  labels:
    app: vk-ads-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vk-ads-ui
  template:
    metadata:
      labels:
        app: vk-ads-ui
    spec:
      containers:
        - name: ui
          image: ghcr.io/esgebel79-byte/vk-ads-mlops-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: vk-ads-ui-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
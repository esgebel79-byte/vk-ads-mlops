apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vk-ads-mlops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/esgebel79-byte/vk-ads-mlops.git
    targetRevision: main
    path: deployments/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: vk-ads-mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

seed: 42

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

offline_dataset:
  n_campaigns: 5000
  max_window_hours: 168

deepsets:
  K: 256

train:
  model_type: deepsets_attention
  epochs: 30
  batch_size: 128
  lr: 0.002
  device: auto

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment: vk-ads-reach-prediction

service:
  model_path: models/deepsets/deepsets_attn.pt
